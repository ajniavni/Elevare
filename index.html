<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevare - Live Government & PSU Jobs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-xl font-bold text-center">Elevare - Live Govt & PSU Jobs</h1>
    </header>

    <main class="max-w-xl mx-auto p-4 flex-grow w-full">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Qualification</label>
                <select id="qualification" class="w-full p-2 border border-slate-300 rounded-lg">
                    <option value="">Select Qualification</option>
                    <option value="8th Pass">8th Pass</option>
                    <option value="10th Pass">10th Pass</option>
                    <option value="12th Pass">12th Pass</option>
                    <option value="ITI / Diploma">ITI / Diploma</option>
                    <option value="Graduate / Any Degree">Graduate / Any Degree</option>
                </select>
            </div>
            <button onclick="findJobs()" class="w-full bg-blue-600 text-white p-2 rounded-lg font-semibold hover:bg-blue-700">Find Matching Jobs</button>
        </div>

        <div id="results" class="mt-6 space-y-4"></div>
    </main>

    <script>
        let allJobs = [];
        fetch('jobs.json')
            .then(res => res.json())
            .then(data => { allJobs = data; })
            .catch(err => console.error("Error loading jobs:", err));

        function findJobs() {
            const selectedQual = document.getElementById('qualification').value;
            const container = document.getElementById('results');
            container.innerHTML = '';

            const filtered = allJobs.filter(job => !selectedQual || job.qual === selectedQual);

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-500">No matching live listings found.</p>';
                return;
            }

            filtered.forEach(job => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2';
                card.innerHTML = `
                    <span class="text-xs font-semibold px-2 py-1 bg-blue-50 text-blue-700 rounded">${job.dept}</span>
                    <h3 class="font-bold text-slate-900">${job.title}</h3>
                    <p class="text-sm text-slate-600">Qualification: <b>${job.qual}</b></p>
                    <p class="text-sm text-red-600 font-semibold">Last Date: ${job.last_date}</p>
                    <a href="${job.link}" target="_blank" class="inline-block text-sm text-blue-600 font-medium hover:underline">Official Notification & Apply →</a>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
